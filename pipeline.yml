name: QEEMA Auto Pipeline

on:
  schedule:
    - cron: '0 6,14 * * 1,4'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg with full filters support
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-cjk \
            fonts-noto-color-emoji libass9 libass-dev fontconfig
          fc-cache -fv
          ffmpeg -version | head -n 1
          ffmpeg -filters 2>/dev/null | grep -E "zoompan|xfade|drawtext|ass" | head

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write Google Cloud credentials file
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > /tmp/gcp-sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-sa-key.json" >> $GITHUB_ENV

      - name: Run Pipeline Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LEONARDO_API_KEY: ${{ secrets.LEONARDO_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python main.py

      - name: Upload generated video (backup artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qeema-output
          path: qeema_output/**/*.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/gcp-sa-key.json
