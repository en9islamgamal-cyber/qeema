name: QEEMA Cinematic Auto Pipeline

on:
  schedule:
    - cron: '0 6,14 * * 1,4' # يشتغل تلقائياً مرتين في أيام محددة
  workflow_dispatch: # زر التشغيل اليدوي

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Advanced FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core libass9 fontconfig
          fc-cache -fv

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pipeline Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LEONARDO_API_KEY: ${{ secrets.LEONARDO_API_KEY }}
          # YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }} # إذا كنت سترفع تلقائياً
        run: python main.py

      - name: Upload generated video (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qeema-cinematic-output
          path: qeema_output/
          retention-days: 5
