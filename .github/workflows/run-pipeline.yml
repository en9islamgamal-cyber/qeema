name: QEEMA Auto Pipeline

on:
  schedule:
    # يعمل كل يوم اثنين وخميس الساعة 6:00 ص و 2:00 م بتوقيت غرينتش
    # (ما يعادل 9:00 ص و 5:00 م بتوقيت مكة المكرمة)
    - cron: '0 6,14 * * 1,4'
  
  workflow_dispatch: # يسمح لك بتشغيل الجدول يدوياً من تبويب Actions في GitHub عند الحاجة

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pipeline Script
        env:
          # بيانات Supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          
          # مفاتيح الذكاء الاصطناعي (هذه الإضافة تضمن عمل Claude)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          
          # مفتاح ElevenLabs للتعليق الصوتي
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python main.py
