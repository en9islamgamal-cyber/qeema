name: "VALUE QEEMA Pipeline v5"

on:
  schedule:
    - cron: "0 3 * * 1,4"
  workflow_dispatch:
    inputs:
      episode_number:
        description: "Episode number (leave empty for next pending)"
        required: false
        type: string
      dry_run:
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

env:
  PYTHON_VERSION: "3.11"
  TZ: "Asia/Kuwait"

jobs:
  pipeline:
    name: "Produce Episode"
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: "📦 System Dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-cjk fonts-hosny-amiri libfreetype6-dev libsndfile1
          ffmpeg -version | head -n 1

      - name: "📁 Directories"
        run: |
          mkdir -p logs temp/episodes temp/tts_cache temp/assembly output/videos assets/thumbnails assets/fonts assets/overlays assets/brand
          [ -f "Amiri-Bold.ttf" ] && cp Amiri-Bold.ttf assets/fonts/
          [ -f "logo.png" ] && cp logo.png assets/

      - name: "🐍 Python Packages"
        run: pip install -r requirements.txt -q

      - name: "🔐 Google Cloud"
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          echo "$GCP_SA_KEY" > /tmp/gcp_sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp_sa.json" >> $GITHUB_ENV

      - name: "🚀 Run Pipeline"
        env:
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2:    ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3:    ${{ secrets.GEMINI_API_KEY_3 }}
          COHERE_API_KEY:      ${{ secrets.COHERE_API_KEY }}
          LEONARDO_API_KEY:    ${{ secrets.LEONARDO_API_KEY }}
          ELEVENLABS_API_KEY:  ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:        ${{ secrets.SUPABASE_KEY }}
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          ARGS=""
          [ -n "${{ github.event.inputs.episode_number }}" ] && ARGS="--episode ${{ github.event.inputs.episode_number }}"
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          max_retries=3; attempt=1; success=false
          until [ $attempt -gt $max_retries ]; do
            echo "🚀 Attempt $attempt/$max_retries"
            if python -u main.py $ARGS; then success=true; break
            else echo "⚠️ Retry in 90s..."; sleep 90; attempt=$((attempt+1)); fi
          done
          [ "$success" = false ] && exit 1

      - name: "📤 Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ github.run_number }}
          path: |
            output/videos/*.mp4
            assets/thumbnails/*.jpg
            logs/*.log
          retention-days: 21
          if-no-files-found: warn