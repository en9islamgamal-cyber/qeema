name: QEEMA Pipeline v15

on:
  schedule:
    # Run every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      episode:
        description: "Specific episode number (leave empty for next pending)"
        required: false
        type: string
      dry_run:
        description: "Skip YouTube upload"
        required: false
        type: boolean
        default: false
      enable_subtitles:
        description: "Burn Arabic subtitles into video"
        required: false
        type: boolean
        default: false
      force_regenerate:
        description: "Clear script cache (forces fresh v15 script generation)"
        required: false
        type: boolean
        default: false

# Avoid concurrent pipeline runs (DB races)
concurrency:
  group: qeema-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      # ── Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # ── System dependencies (FFmpeg + fonts for Arabic rendering)
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto fonts-noto-cjk

      # ── Python deps
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── Playwright (with cache)
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Install Playwright system deps (always)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      # ── v15 NEW: Cache the Quran audio (huge — saves ~30s per run)
      - name: Cache Quran audio
        uses: actions/cache@v4
        with:
          path: assets/quran_audio
          key: quran-audio-${{ hashFiles('data/curriculum.py') }}
          restore-keys: |
            quran-audio-

      # ── v15 NEW: Cache TTS results across runs (saves ElevenLabs $$ on retries)
      - name: Cache TTS audio
        uses: actions/cache@v4
        with:
          path: temp/tts_cache
          key: tts-cache-${{ github.run_id }}
          restore-keys: |
            tts-cache-

      # ── v15 NEW: Cache rendered scenes (saves Playwright render time)
      - name: Cache rendered scenes
        uses: actions/cache@v4
        with:
          path: temp/scene_cache
          key: scene-cache-${{ github.run_id }}
          restore-keys: |
            scene-cache-

      # ── v15 NEW: Force regenerate option clears script cache
      - name: Force-regenerate scripts (if requested)
        if: ${{ inputs.force_regenerate == true }}
        run: |
          echo "🔄 Clearing v14 script cache to force v15 regeneration"
          rm -rf temp/episodes/*.json || true

      # ── v15 NEW: Verify required assets present
      - name: Verify v15 assets
        run: |
          echo "═══ v15 Asset Check ═══"
          [ -f assets/Amiri-Bold.ttf ] && echo "✅ Amiri font OK" || echo "⚠️  Amiri font MISSING (will fall back to Google Fonts)"
          [ -f assets/logo.png ] && echo "✅ Logo PNG OK" || echo "⚠️  Logo PNG MISSING (will fall back to CSS text)"
          [ -f assets/overlays/bgm.mp3 ] && echo "✅ BGM nasheed OK" || echo "⚠️  BGM file MISSING (will skip BGM mix stage)"

      # ── Run pipeline (with retry up to 3x for transient failures)
      - name: Run QEEMA pipeline v15
        env:
          # LLM
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          # TTS
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID || 'UR972wNGq3zluze0LoIp' }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp-sa.json
          # DB
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # YouTube
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # Image generation (v15+: for Leonardo integration)
          LEONARDO_API_KEY: ${{ secrets.LEONARDO_API_KEY }}
          # ── v15 NEW: Pipeline feature flags
          ENABLE_SUBTITLES: ${{ inputs.enable_subtitles && 'true' || 'false' }}
          ENABLE_CROSSFADES: 'true'
          ENABLE_COLOR_GRADE: 'true'
          ENABLE_BGM: 'true'
          # ── v15 NEW: Quality gate threshold (0-100, regenerate below)
          QUALITY_THRESHOLD: '70'
          # ── v15 NEW: Voice tuning overrides (optional fine-tuning)
          ELEVENLABS_SPEED: '0.85'
          ELEVENLABS_STABILITY: '0.68'
          ELEVENLABS_STYLE: '0.30'
          # Misc
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          PYTHONUNBUFFERED: '1'
        run: |
          # Write GCP service account if provided (handle multi-line JSON safely)
          GCP_KEY='${{ secrets.GCP_SA_KEY }}'
          if [ -n "$GCP_KEY" ]; then
            echo "$GCP_KEY" > "$GOOGLE_APPLICATION_CREDENTIALS"
          fi

          # Build args
          ARGS=""
          EPISODE='${{ inputs.episode }}'
          if [ -n "$EPISODE" ]; then
            ARGS="--episode $EPISODE"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          echo "═══ QEEMA Pipeline v15 ═══"
          echo "Episode:        ${EPISODE:-<auto>}"
          echo "Dry run:        ${{ inputs.dry_run }}"
          echo "Subtitles:      ${{ inputs.enable_subtitles }}"
          echo "Quality gate:   $QUALITY_THRESHOLD/100"
          echo "Voice speed:    $ELEVENLABS_SPEED (slower for kids 5-8)"
          echo ""

          # Retry up to 3x for transient failures
          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            echo "═══ Attempt $i/$MAX_RETRIES ═══"
            if python main.py $ARGS; then
              echo "✅ Pipeline succeeded on attempt $i"
              exit 0
            fi
            echo "❌ Attempt $i failed"
            if [ $i -lt $MAX_RETRIES ]; then
              echo "Waiting 60s before retry..."
              sleep 60
            fi
          done
          echo "❌ Pipeline failed after $MAX_RETRIES attempts"
          exit 1

      # ── v15 NEW: Cost summary (read JSONL log if generated)
      - name: Cost summary
        if: always()
        continue-on-error: true
        run: |
          if [ -d logs ]; then
            TODAY=$(date +%Y-%m-%d)
            COST_FILE="logs/costs_${TODAY}.jsonl"
            if [ -f "$COST_FILE" ]; then
              echo "═══ Cost Summary (today) ═══"
              python3 -c "
          import json, sys
          total = 0.0
          by_provider = {}
          with open('$COST_FILE') as f:
              for line in f:
                  e = json.loads(line)
                  total += e['cost_usd']
                  by_provider[e['provider']] = by_provider.get(e['provider'], 0) + e['cost_usd']
          print(f'Total: \${total:.4f} USD')
          for p, c in sorted(by_provider.items(), key=lambda x: -x[1]):
              print(f'  {p:30s} \${c:.4f}')
          "
            fi
          fi

      # ── Always: clean up secrets file
      - name: Clean up
        if: always()
        run: rm -f "${{ github.workspace }}/gcp-sa.json"

      # ── On failure: upload logs
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: |
            logs/
            temp/episodes/*.json
          retention-days: 7
          if-no-files-found: ignore

      # ── v15 NEW: Always upload cost log (even on success — for tracking)
      - name: Upload cost log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cost-log-${{ github.run_id }}
          path: logs/costs_*.jsonl
          retention-days: 30
          if-no-files-found: ignore
