name: QEEMA Pipeline

on:
  schedule:
    # Run every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      episode:
        description: "Specific episode number (leave empty for next pending)"
        required: false
        type: string
      dry_run:
        description: "Skip YouTube upload"
        required: false
        type: boolean
        default: false

# Avoid concurrent pipeline runs (DB races)
concurrency:
  group: qeema-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      # ── Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # ── System dependencies (FFmpeg, fonts)
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-core \
            fonts-amiri \
            fonts-dejavu

      # ── Python deps
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── Playwright (with cache)
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Install Playwright system deps (always)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      # ── Run pipeline (with retry up to 3x for transient failures)
      - name: Run QEEMA pipeline
        env:
          # LLM
          GEMINI_API_KEY: ${{ secrets.GEMINI }}
          GROQ_API_KEY: ${{ secrets.GROQ }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC }}
          COHERE_API_KEY: ${{ secrets.COHERE }}
          # TTS
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID || 'UR972wNGq3zluze0LoIp' }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp-sa.json
          # DB
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # YouTube
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # Other
          LEONARDO_API_KEY: ${{ secrets.LEONARDO }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          # Write GCP service account if provided
          if [ -n "${{ secrets.GCP_SA }}" ]; then
            echo '${{ secrets.GCP_SA }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          fi

          # Build args
          ARGS=""
          if [ -n "${{ inputs.episode }}" ]; then
            ARGS="--episode ${{ inputs.episode }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          # Retry up to 3x for transient failures
          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            echo "═══ Attempt $i/$MAX_RETRIES ═══"
            if python main.py $ARGS; then
              echo "✅ Pipeline succeeded on attempt $i"
              exit 0
            fi
            echo "❌ Attempt $i failed"
            if [ $i -lt $MAX_RETRIES ]; then
              echo "Waiting 60s before retry..."
              sleep 60
            fi
          done
          echo "❌ Pipeline failed after $MAX_RETRIES attempts"
          exit 1

      # ── Always: clean up secrets file
      - name: Clean up
        if: always()
        run: rm -f "${{ github.workspace }}/gcp-sa.json"

      # ── On failure: upload logs
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore
