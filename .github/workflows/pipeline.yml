name: "VALUE QEEMA Pipeline"

on:
  schedule:
    - cron: "0 3 * * 1,4"
  workflow_dispatch:
    inputs:
      episode_number:
        description: "Episode number (leave empty for auto)"
        required: false
        type: string
      dry_run:
        description: "Test mode"
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: "3.11"
  TZ: "Asia/Kuwait"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pipeline:
    name: "Produce Episode"
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4
        
      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: "Install System Dependencies (FFmpeg & Fonts)"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-arabeyes fonts-noto-core libfreetype6-dev

      - name: "Install Python Packages"
        run: |
          python -m pip install --upgrade pip -q
          pip install -r requirements.txt -q

      - name: "Verify Imports (Sanity Check)"
        run: python3 -c "import config, models, script_engine, voice_engine_v2, visual_engine, sfx_engine, video_engine, thumbnail_engine, gamification_engine, orchestrator; print('✅ All imports OK')"

      - name: "Create Required Directories"
        run: |
          mkdir -p logs temp/episodes/{tts_cache,quran_audio_cache} temp/assembly
          mkdir -p output/{videos,shorts} assets/{fonts,music,sfx,overlays,thumbnails}

      - name: "Setup GCP Credentials"
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$GCP_SA_KEY" ]; then
            echo "$GCP_SA_KEY" > /tmp/gcp_sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp_sa.json" >> $GITHUB_ENV
            echo "✅ GCP credentials configured."
          else
            echo "⚠️ GCP_SA_KEY is not set."
          fi

      - name: "Smart Cache Management"
        uses: actions/cache@v4
        with:
          path: |
            temp/episodes/tts_cache
            temp/episodes/quran_audio_cache
            assets/thumbnails
          key: qeema-assets-v1-${{ github.run_number }}
          restore-keys: |
            qeema-assets-v1-

      - name: "Run Pipeline with Auto-Retry (Anti-Failure Shield)"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LEONARDO_API_KEY: ${{ secrets.LEONARDO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.episode_number }}" ]; then
            ARGS="--episode ${{ github.event.inputs.episode_number }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          
          # حلقة تكرار ذكية لتفادي الأعطال المفاجئة (مثل انقطاع الاتصال)
          max_retries=3
          attempt=1
          until python main.py $ARGS; do
            exit_code=$?
            if [ $attempt -ge $max_retries ]; then
              echo "❌ Pipeline failed permanently after $max_retries attempts."
              exit $exit_code
            fi
            echo "⚠️ Pipeline crashed with exit code $exit_code. Retrying in 60 seconds... (Attempt $attempt/$max_retries)"
            sleep 60
            attempt=$((attempt + 1))
          done

      - name: "Upload Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-results-${{ github.run_number }}
          path: |
            output/videos/*.mp4
            assets/thumbnails/*.jpg
            logs/*.log
          retention-days: 21

      - name: "Cleanup Secrets"
        if: always()
        run: rm -f /tmp/gcp_sa.json
