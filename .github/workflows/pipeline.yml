name: QEEMA v2 — Episode Pipeline

on:
  # Manual trigger from the GitHub UI
  workflow_dispatch:
    inputs:
      episode_number:
        description: 'Episode number from data/curriculum.py (1-38)'
        required: true
        type: number
      dry_run:
        description: 'Skip YouTube upload (for testing)'
        required: false
        type: boolean
        default: false
      force:
        description: 'Ignore caches, regenerate everything'
        required: false
        type: boolean
        default: false

  # Scheduled runs: twice weekly (Sun & Wed at 06:00 UTC)
  schedule:
    - cron: '0 6 * * 0'
    - cron: '0 6 * * 3'

# Single concurrency group — never run two episodes at once
concurrency:
  group: qeema-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build_episode:
    name: Build & publish episode
    runs-on: ubuntu-latest
    timeout-minutes: 80

    env:
      # ─── API credentials from GitHub Secrets ─────────────────
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      LEONARDO_API_KEY: ${{ secrets.LEONARDO_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

      # Required for runs from `schedule`: pick episode by date-based logic
      QEEMA_DEFAULT_EPISODE: '3'  # change after each successful episode

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install system deps (ffmpeg + fonts)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            ffmpeg fonts-noto-core

      - name: Verify Amiri font for thumbnails
        run: |
          # Prefer the font shipped in assets/ (committed to repo)
          if [ -f assets/Amiri-Bold.ttf ]; then
            echo "✓ Amiri Bold found in assets/ (size: $(du -h assets/Amiri-Bold.ttf | cut -f1))"
          else
            echo "⚠️  assets/Amiri-Bold.ttf not found in repo."
            echo "    Attempting fallback: install fonts-amiri from apt..."
            sudo apt-get install -y --no-install-recommends fonts-amiri || true
            mkdir -p assets
            if [ -f /usr/share/fonts/truetype/amiri/amiri-bold.ttf ]; then
              cp /usr/share/fonts/truetype/amiri/amiri-bold.ttf assets/Amiri-Bold.ttf
              echo "✓ Amiri Bold copied from system to assets/"
            elif [ -f /usr/share/fonts/truetype/amiri/Amiri-Bold.ttf ]; then
              cp /usr/share/fonts/truetype/amiri/Amiri-Bold.ttf assets/Amiri-Bold.ttf
              echo "✓ Amiri Bold copied from system to assets/"
            else
              echo "⚠️  Amiri not available; thumbnails will fall back to logo-only mode"
            fi
          fi

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify FFmpeg & Python
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          python --version

      - name: Verify assets present
        run: |
          if [ ! -f assets/logo.png ]; then
            echo "⚠️  WARNING: assets/logo.png not found."
            echo "    Video will build without watermark/intro splash."
            echo "    Commit your channel logo to assets/logo.png for production."
          else
            echo "✓ Logo present"
            ls -lh assets/logo.png
          fi

      - name: Resolve episode number
        id: episode
        run: |
          if [ -n "${{ inputs.episode_number }}" ]; then
            echo "num=${{ inputs.episode_number }}" >> $GITHUB_OUTPUT
          else
            # On scheduled runs, use the default from env
            echo "num=${{ env.QEEMA_DEFAULT_EPISODE }}" >> $GITHUB_OUTPUT
          fi

      - name: Run pipeline
        run: |
          ARGS="--episode ${{ steps.episode.outputs.num }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          echo "Running: python main.py $ARGS"
          python main.py $ARGS

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ steps.episode.outputs.num }}-debug
          path: |
            state/
            logs/
            temp/audio_mix/
          retention-days: 7

      - name: Upload final video artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ steps.episode.outputs.num }}-final
          path: |
            state/episodes/episode_*/*.mp4
            state/episodes/episode_*/thumbnails/*.jpg
            state/episodes/episode_*/bundle.json
          retention-days: 30